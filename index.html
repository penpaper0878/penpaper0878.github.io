<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening the writings…</title>
<style>
  :root { --bg: #f6f1e7; --ink: #2b2620; --muted: #7a6f62; --accent: #a9662b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14110d; --ink: #efe7da; --muted: #a59a8b; --accent: #e0a066; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { display: flex; align-items: center; justify-content: center; padding: 16px;
         box-sizing: border-box; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 26rem; }
  h1 { font: 600 1.4rem/1.3 Georgia, serif; margin: 0 0 .5rem; }
  p { margin: .4rem 0; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
<script>
/* Every address on penpaper0878.github.io that no other site answers ends up
   here: the bare domain, the repository's old name, a mistyped capital letter.
   Send each one to the writings.

   The repository's id never changes; its name can. Asking GitHub for the
   current name means this keeps working after a rename, with nothing to
   update here. If GitHub does not answer quickly, the last known name is used. */
(function () {
  var OWNER = 'penpaper0878';
  var REPO_ID = 1358372385;
  var LAST_KNOWN = 'My-Writings';
  // Names this repository has had, lower-case. Paths under them keep their
  // place: /instatements/writings/#/e/abc opens that same piece.
  var OLD_NAMES = ['instatements', 'my-writings'];

  function destination(name) {
    var parts = location.pathname.split('/');
    var first = parts[1] || '';
    var lower = first.toLowerCase();
    if (lower && (OLD_NAMES.indexOf(lower) !== -1 || lower === name.toLowerCase())) {
      return '/' + name + '/' + parts.slice(2).join('/') + location.search + location.hash;
    }
    return '/' + name + '/writings/' + location.hash;
  }

  var done = false;
  function go(name) {
    if (done) return;
    done = true;
    var url = destination(name);
    var link = document.getElementById('go');
    if (link) link.href = url;
    // Already at that exact address and it is still missing: the site itself
    // is down, so say so instead of reloading forever.
    if (url === location.pathname + location.search + location.hash) {
      var note = document.getElementById('note');
      if (note) note.textContent = 'The site is not answering right now. Please try again in a few minutes.';
      return;
    }
    location.replace(url);
  }

  setTimeout(function () { go(LAST_KNOWN); }, 2500);
  try {
    fetch('https://api.github.com/repositories/' + REPO_ID)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (repo) {
        var ok = repo && repo.owner && String(repo.owner.login).toLowerCase() === OWNER &&
                 /^[A-Za-z0-9._-]+$/.test(repo.name || '');
        go(ok ? repo.name : LAST_KNOWN);
      })
      .catch(function () { go(LAST_KNOWN); });
  } catch (err) {
    go(LAST_KNOWN);
  }
})();
</script>
</head>
<body>
<main>
  <h1>Opening the writings…</h1>
  <p id="note">This address has moved. You will be taken there in a moment.</p>
  <p><a id="go" href="/My-Writings/writings/">Go to the writings</a></p>
</main>
</body>
</html>
